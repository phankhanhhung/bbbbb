# NFR-D2: CI validate **toàn kho** mỗi commit, bằng đúng bộ luật mà Studio dùng
# (AUT-04). Kho nhỏ nên chạy cả kho rẻ hơn nhiều so với việc nghĩ cách chạy tăng
# tiến — và chạy cả kho là thứ duy nhất bắt được anchor rot xuyên bài.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (gồm luật phụ thuộc giữa các package)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Validate toàn kho
        run: pnpm validate
